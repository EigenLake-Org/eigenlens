name: vector-ml
services:
  chat-worker:
    build:
      context: .
      target: server
    image: eigenlens-worker
    profiles: ["chat-worker"]
    command: ["eigenlens", "--transport", "http", "--host", "0.0.0.0", "--config", "/app/config/chat-worker.json"]
    ports: ["127.0.0.1:8020:8000"]
    environment:
      EIGENLENS_MCP_TOKEN: ${VECTOR_CHAT_WORKER_TOKEN:-}
      EIGENLENS_WORKERS: ${VECTOR_CHAT_WORKERS:-1}
      EIGENLENS_TOTAL_WORKING_BYTES: "8589934592"
      EIGENLENS_CPU_BUDGET: "2"
      EIGENLENS_CONNECTION_KEY: ${EIGENLENS_CONNECTION_KEY:-${VECTOR_ML_CONNECTION_KEY:-}}
      EIGENLENS_DATABASE_TYPE: ${EIGENLENS_DATABASE_TYPE:-${VECTOR_ML_DATABASE_TYPE:-}}
      EIGENLENS_DATABASE_URL: ${EIGENLENS_DATABASE_URL:-${VECTOR_ML_DATABASE_URL:-}}
      EIGENLENS_DATABASE_API_KEY: ${EIGENLENS_DATABASE_API_KEY:-${VECTOR_ML_DATABASE_API_KEY:-}}
      EIGENLENS_DATABASE_OPTIONS: ${EIGENLENS_DATABASE_OPTIONS:-${VECTOR_ML_DATABASE_OPTIONS:-}}
    volumes: ["chat-worker-data:/data"]
    init: true
    mem_limit: 8g
    cpus: 2
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.15.5
    profiles: ["qdrant"]
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  chat-worker-data:
  qdrant:
