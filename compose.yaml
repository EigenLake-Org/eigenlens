name: vector-ml
services:
  service:
    build:
      context: .
      target: server
    ports: ["127.0.0.1:8000:8000"]
    environment:
      VECTOR_ML_MCP_TOKEN: ${VECTOR_ML_MCP_TOKEN:-local-demo-token}
      PGVECTOR_DSN: postgresql://vector:vector@postgres:5432/vector
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
    volumes: ["artifacts:/data"]
    init: true
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.15.5
    profiles: ["local", "qdrant", "food-demo", "query-jobs"]
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 30
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.32.4
    profiles: ["local", "weaviate"]
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:50051:50051"]
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      QUERY_DEFAULTS_LIMIT: 100
    volumes: ["weaviate:/var/lib/weaviate"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
  postgres:
    image: pgvector/pgvector:pg17
    profiles: ["local", "pgvector"]
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: vector
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: vector
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector -d vector"]
      interval: 5s
      timeout: 3s
      retries: 30
  query-jobs:
    build:
      context: .
      target: query_jobs
    profiles: ["query-jobs"]
    ports: ["127.0.0.1:8010:8010"]
    environment:
      VECTOR_QUERY_TOKEN: ${VECTOR_QUERY_TOKEN:-}
    volumes:
      - query-job-data:/data
      - query-models:/models
      - ./.vector-ml/banking77:/prepared:ro
    depends_on:
      qdrant:
        condition: service_healthy
    init: true
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped
  chat-worker:
    build:
      context: .
      target: server
    image: vector-ml-chat-worker
    profiles: ["chat-worker"]
    command: ["vector-ml", "--transport", "http", "--host", "0.0.0.0", "--config", "/app/config/chat-worker.json"]
    ports: ["127.0.0.1:8020:8000"]
    environment:
      VECTOR_ML_MCP_TOKEN: ${VECTOR_CHAT_WORKER_TOKEN:-}
    volumes: ["chat-worker-data:/data"]
    init: true
    mem_limit: 8g
    cpus: 2
    restart: unless-stopped
  food-loader:
    build:
      context: .
      target: demo_client
    image: vector-ml-demo-client
    profiles: ["food-demo"]
    command: ["python", "-m", "examples.food_reviews", "setup", "--qdrant-url", "http://qdrant:6333", "--cache-dir", "/cache"]
    volumes: ["food-cache:/cache"]
    depends_on:
      qdrant:
        condition: service_healthy
  food-client:
    build:
      context: .
      target: demo_client
    image: vector-ml-demo-client
    profiles: ["demo-client"]
    environment:
      VECTOR_ML_MCP_URL: http://service:8000/mcp
      VECTOR_ML_MCP_TOKEN: ${VECTOR_ML_MCP_TOKEN:-local-demo-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes: ["food-cache:/cache:ro", "./demo-output:/output"]
    depends_on:
      service:
        condition: service_healthy
volumes:
  artifacts:
  qdrant:
  weaviate:
  postgres:
  food-cache:
  query-job-data:
  query-models:
  chat-worker-data:
