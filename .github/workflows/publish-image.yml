name: Publish container image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Image metadata
        id: meta
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* && ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must have the form v1.2.3' >&2
            exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "build_tag=build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: eigenlens-ci:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Check image startup and runtime
        env:
          IMAGE: eigenlens-ci:${{ github.sha }}
        run: |
          docker run --detach --name image-smoke \
            --env EIGENLENS_MCP_TOKEN=ci-smoke-token "$IMAGE"
          for attempt in $(seq 1 90); do
            status="$(docker inspect --format '{{.State.Health.Status}}' image-smoke)"
            if [[ "$status" == healthy ]]; then break; fi
            sleep 2
          done
          [[ "$status" == healthy ]]
          docker exec -i \
            --env EIGENLENS_TRANSPORT=http \
            --env EIGENLENS_MCP_URL=http://127.0.0.1:8000/mcp \
            --env EIGENLENS_MCP_TOKEN=ci-smoke-token \
            image-smoke python - < examples/mcp_client.py > smoke.json
          python3 -c 'import json; t=json.load(open("smoke.json")); jobs=[c["result"] for c in t["trace"] if c["tool"]=="get_job"]; assert jobs[-1]["status"]=="succeeded"; assert len(t["tools"])==13; print("Authenticated MCP, DBSCAN, BERTopic and paginated results passed")'
      - name: Container diagnostics
        if: failure()
        run: docker logs --tail 100 image-smoke || true
      - name: Stop check container
        if: always()
        run: docker rm -f image-smoke || true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push checked architecture
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          BUILD_TAG: ${{ steps.meta.outputs.build_tag }}
        run: |
          docker tag "eigenlens-ci:$GITHUB_SHA" "$IMAGE:$BUILD_TAG"
          docker push "$IMAGE:$BUILD_TAG"

  publish:
    name: Publish multi-platform release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest and tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS=(--tag "$IMAGE:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS+=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" \
            "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-amd64" \
            "$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-arm64"
          docker buildx imagetools inspect --raw "$IMAGE:sha-$GITHUB_SHA" > manifest.json
          python3 -c 'import json; m=json.load(open("manifest.json")); p={(i["platform"]["os"], i["platform"]["architecture"]) for i in m["manifests"]}; assert {("linux","amd64"),("linux","arm64")} <= p, p'
          echo "Published $IMAGE:sha-$GITHUB_SHA for linux/amd64 and linux/arm64" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach deployment file to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n\n%s\n\n%s\n' \
            "Docker image: $IMAGE:$VERSION" \
            'Platforms: linux/amd64 and linux/arm64. Each image passes a runtime check before publication.' \
            'Download compose.release.yaml to deploy without cloning or building source. See the repository README for environment settings.' > release-notes.md
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "EigenLens $VERSION" --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" compose.release.yaml --clobber
