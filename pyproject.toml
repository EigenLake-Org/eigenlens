[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vector-tools"
version = "0.1.0"
description = "Clustering and topic labels for vector records through Python and MCP"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.13,<2", "scikit-learn>=1.6,<2", "pydantic>=2.10,<3", "threadpoolctl>=3", "bertopic>=0.17.4,<0.18"]

[project.optional-dependencies]
banking = ["datasets>=4,<5", "sentence-transformers>=5,<6", "qdrant-client>=1.15,<2"]
server = ["mcp>=1.30,<2", "uvicorn>=0.30"]
test = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28"]

[project.scripts]
vector-ml = "vector_tools.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
