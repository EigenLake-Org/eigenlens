[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vector-tools"
version = "0.1.0"
description = "Portable local ML execution for vector records, Python and MCP"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.13,<2", "scikit-learn>=1.6,<2", "pydantic>=2.10,<3", "pyarrow>=18", "threadpoolctl>=3"]

[project.optional-dependencies]
banking = ["datasets>=3,<5", "sentence-transformers>=3,<6", "pandas>=2,<3", "plotly>=5,<7"]
server = ["mcp>=1.30,<2", "uvicorn>=0.30"]
agents = ["openai-agents>=0.22.2,<0.23"]
sentiment = ["vaderSentiment==3.3.2"]
qdrant = ["qdrant-client>=1.15,<1.16"]
weaviate = ["weaviate-client>=4.16,<5"]
pgvector = ["psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1"]
pinecone = ["pinecone>=7,<9"]
test = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28"]

[project.scripts]
vector-ml = "vector_tools.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires running database services"]
